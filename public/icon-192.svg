<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with Rounded Corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>
  
  <!-- Camera Body -->
  <g transform="translate(26, 32)">
    <!-- Top Flash/Pentaprism bump -->
    <path d="M 50 25 L 60 12 L 80 12 L 90 25 Z" fill="url(#goldGrad)" />
    <rect x="100" y="16" width="18" height="9" rx="3" fill="#ef4444" />
    
    <!-- Main Camera Body -->
    <rect x="10" y="25" width="120" height="85" rx="18" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Lens Outer Ring -->
    <circle cx="70" cy="67" r="34" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5" filter="url(#glow)"/>
    <!-- Lens Middle Glass -->
    <circle cx="70" cy="67" r="24" fill="#020617" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
    <!-- Lens Inner Aperture Element -->
    <circle cx="70" cy="67" r="14" fill="#f59e0b" opacity="0.8"/>
    <circle cx="65" cy="62" r="5" fill="#ffffff" opacity="0.8"/>
    
    <!-- Red recording dot -->
    <circle cx="28" cy="42" r="5" fill="#ef4444"/>
    <circle cx="112" cy="42" r="4" fill="#10b981"/>
  </g>
  
  <!-- Small Brand Text -->
  <text x="96" y="160" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="1">
    CREW <tspan fill="#f59e0b">NET</tspan>
  </text>
</svg>
